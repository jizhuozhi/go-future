version: "2"

run:
  timeout: 5m

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - unused
    - ineffassign
  settings:
    revive:
      ignore-generated-header: true
      severity: warning
  exclusions:
    rules:
      - path: _test\.go
        text: ".*"

formatters:
  enable:
    - gofmt
    - goimports
